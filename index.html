<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9e8f5">
<meta name="description" content="منوی کافه موزه رشت · Café Muzeh Rasht menu">
<title>منوی کافه موزه رشت</title>
<style>
:root{--bg:#c9e8f5;--ink:#5c0f14;--soft:#7a3a3e;--card:#d9f0fa;--line:#5c0f1455;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3b0a0e;--ink:#cfeaf7;--soft:#a9cfe0;--card:#4a1216;--line:#cfeaf755}}
:root[data-theme="dark"]{--bg:#3b0a0e;--ink:#cfeaf7;--soft:#a9cfe0;--card:#4a1216;--line:#cfeaf755}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.9}
.f{font-family:'Aref Ruqaa','Noto Naskh Arabic',serif}
header{text-align:center;padding:44px 20px 12px}
.logo{width:150px;height:150px;margin:0 auto 18px;border:2px solid var(--ink);border-radius:50%;display:grid;place-content:center;position:relative}
.logo:before{content:"";position:absolute;inset:6px;border:1.5px dotted var(--ink);border-radius:50%}
.logo b{font-family:'Aref Ruqaa',serif;font-size:26px;line-height:1.3}
.logo small{font-size:13px;letter-spacing:1px}
.note{max-width:560px;margin:18px auto 0;padding:10px 26px;border:1.5px solid var(--ink);border-radius:26px 8px;font-family:'Aref Ruqaa',serif;font-size:18px}
.sub{font-size:13px;color:var(--soft);margin:10px 0 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 14px;margin-top:18px;scrollbar-width:none}
nav a{flex:none;color:var(--ink);text-decoration:none;font-family:'Aref Ruqaa',serif;font-size:18px;padding:2px 16px;border:1.5px solid var(--line);border-radius:18px 6px}
nav a:active,nav a.on{background:var(--ink);color:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 60px}
.search{width:100%;margin:18px 0 0;padding:10px 18px;border:1.5px solid var(--line);border-radius:20px 6px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.search::placeholder{color:var(--soft)}
section{margin-top:40px}
h2{font-family:'Aref Ruqaa',serif;font-size:38px;font-weight:700;text-align:center;margin:0 0 4px}
h2:before,h2:after{content:"❦";font-size:16px;margin:0 14px;vertical-align:middle;opacity:.8}
.tag{text-align:center;font-size:13px;color:var(--soft);margin:0 0 14px}
.it{display:flex;align-items:baseline;gap:8px;padding:8px 0}
.it .n{font-family:'Aref Ruqaa',serif;font-size:21px;font-weight:700;line-height:1.5}
.it .d{display:block;font-size:12.5px;color:var(--soft);line-height:1.7;font-weight:300}
.dots{flex:1;border-bottom:2px dotted var(--line);min-width:20px;transform:translateY(-4px)}
.p{font-family:'Aref Ruqaa',serif;font-size:22px;font-weight:700;white-space:nowrap}
span.p{pointer-events:none}
.p i{font-style:normal;font-family:'Vazirmatn';font-size:11px;color:var(--soft);margin:0 3px 0 10px;font-weight:300}
.cols{display:flex;justify-content:flex-start;gap:26px;font-family:'Aref Ruqaa',serif;font-size:16px;color:var(--soft);margin:0 0 -4px}
.hide{display:none}
footer{text-align:center;padding:10px 20px 50px;font-family:'Aref Ruqaa',serif;font-size:17px}
footer small{display:block;font-family:'Vazirmatn';font-size:12px;color:var(--soft);margin-top:6px}

.logo:before{display:none}
section:before{content:"";display:block;height:14px;margin:0 auto 6px;max-width:300px;background:radial-gradient(circle,var(--ink) 2.5px,transparent 3px) center/18px 14px repeat-x;opacity:.55}
.fe{margin-top:34px}
.fe h3{font-family:'Aref Ruqaa',serif;font-size:22px;text-align:center;margin:0 0 6px;line-height:1.9}
.fe h3:before,.fe h3:after{content:"❦";font-size:13px;margin:0 10px;vertical-align:middle;opacity:.8}
.fr{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;mask-image:linear-gradient(90deg,transparent 0,var(--ink) 14px,var(--ink) calc(100% - 14px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,var(--ink) 14px,var(--ink) calc(100% - 14px),transparent 100%)}
.fc{flex:none;width:156px;scroll-snap-align:start;color:var(--ink);text-decoration:none;background:var(--card);border:1.5px solid var(--ink);border-radius:28px 8px;padding:12px 14px;text-align:center;position:relative}
.fc:before{content:"";position:absolute;inset:4px;border:1px dotted var(--line);border-radius:24px 6px;pointer-events:none}
.fc.pick{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc.pick.tapfx{animation:fcfx .5s ease}
@keyframes fcfx{0%{transform:scale(.96);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 28%,transparent)}100%{transform:none;box-shadow:none}}
.fc b{display:block;font-family:'Aref Ruqaa',serif;font-size:21px;line-height:1.5}
.fc small{display:block;font-size:11.5px;color:var(--soft);line-height:1.6;margin:2px 0 6px;min-height:36px}
.fc span{font-family:'Aref Ruqaa',serif;font-size:21px;font-weight:700}
.bd{font-family:'Vazirmatn';font-size:10.5px;font-weight:400;border:1px solid var(--ink);border-radius:10px 3px;padding:0 7px;margin-right:8px;vertical-align:middle;white-space:nowrap}
.bd.v{background:var(--ink);color:var(--bg)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

.lg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:16px;font:600 13px 'Vazirmatn',sans-serif;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:14px 5px;padding:2px 14px;cursor:pointer}
.lg:active{background:var(--ink);color:var(--bg)}
.ps{display:flex;gap:10px;align-items:baseline}
.cols{justify-content:flex-end!important;gap:10px!important}
.cols span,.ps .p.w{min-width:58px;text-align:center}
.bd{margin-right:0!important;margin-inline-start:8px}
html[lang=en] body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6}
html[lang=en] h2,html[lang=en] .fe h3,html[lang=en] .it .n,html[lang=en] .p,html[lang=en] .fc b,html[lang=en] .fc span,html[lang=en] nav a,html[lang=en] .note,html[lang=en] footer,html[lang=en] .cols{font-family:'Cormorant Garamond',Georgia,serif!important;font-variant-numeric:lining-nums}
html[lang=en] h2{font-size:42px!important;line-height:1.3!important}
html[lang=en] .it .n{font-size:22px}html[lang=en] .p,html[lang=en] .fc span{font-size:23px}
html[lang=en] .fc b{font-size:22px}html[lang=en] nav a{font-size:18px}html[lang=en] .note{font-size:20px}

.pill{position:absolute;left:0;top:0;z-index:0;border-radius:18px 6px;background:var(--ink);pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.34,1.45,.64,1),width .45s cubic-bezier(.34,1.45,.64,1),opacity .2s}

      const td=!!(TODAY&&TODAY.id===s.id&&TODAY.j===j),MT=(sp?`<span class="seal v" role="img" aria-label="${U.v}" title="${U.v}"></span>`:'')+bd+(so?`<span class="bd">${U.s}</span>`:'')+tgs(tg)+(td?`<span class="badge">${U.tdy}</span>`:'');
      return`<div class="it${sp?' sp':''}${so||p===''?'':' pick'}"${td?' data-today="1"':''}${so||p===''?'':` data-k="${K}" data-p="${firstPrice(p)}" data-t="${esc(N)}" data-te="${esc(en?N:e.i[j][0])}" role="button" tabindex="0" aria-label="${U.add}"`}><div><span class="n">${N}${MT}</span>${D?`<span class="d">${D}</span>`:''}</div>${p===''?'':'<span class="dots"></span>'}${price(p,{k:K,N:N,Ne:en?N:e.i[j][0]})}</div>`}).join('')}</section>`)});
  $('fr').innerHTML=FE.map(([n,d,p,id],j)=>{const f=M.map(s=>s.i.map((it,k)=>[it,s.id,k])).flat().find(x=>x[0][0]===n);
    const K=f?f[1]+':'+f[2]:id+':-1',td=!!(f&&TODAY&&TODAY.id===f[1]&&TODAY.j===f[2]),pr=f?firstPrice(f[0][2]):p;
    return`<div class="fc${td?' today':''}"${pr?` data-k="${K}" data-p="${pr}" data-t="${esc(n)}" data-te="${esc(FEN[j]?FEN[j][0]:n)}"`:''}><a href="#${id}"${td?' data-today="1"':''} tabindex="-1"><b>${L==='fa'?n:FEN[j][0]}${td?` <span class="badge">${U.tdy}</span>`:''}</b><small>${L==='fa'?d:FEN[j][1]}</small><span>${num(p)}</span></a></div>`}).join('');
  document.querySelectorAll('.it.pick[data-today],.fc.today a').forEach(el=>el.classList.add('sel'));
  document.querySelectorAll('.fc[data-k]').forEach(el=>{el.classList.add('pick');el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label',U.add)});
  ['lgda','lgdb'].forEach((id,k)=>{const a=$(id);a.onclick=ev=>{ev.preventDefault();
    let t=null;
    document.querySelectorAll(k?'.it .seal:not(.v)':'.it .seal.v').forEach(x=>{const row=x.closest('.it');if(row&&!row.classList.contains('hide')&&!t)t=row});
    if(!t)return;t.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'center'});tapFx(t);setTimeout(()=>{t.classList.add('sel');setTimeout(()=>t.classList.remove('sel'),1600)},reduceMotion()?0:420)};});
  renderOrd();
  document.querySelectorAll('section,.fe').forEach(el=>{el.classList.add('rv');io.observe(el)});
  renderContact();$('clh').textContent=L==='fa'?'ساعت را لمس کن':'Tap the clock';$('tower').setAttribute('aria-label',L==='fa'?'ساعت شهرداری رشت':'Rasht municipality clock tower');clockTick();setSpy();nav.scrollLeft=0;document.querySelectorAll('.lgb').forEach(b=>b.setAttribute('aria-label',L==='fa'?'Switch to English':'تغییر به فارسی'));nav.setAttribute('aria-label',L==='fa'?'دسته‌بندی منو':'Menu categories');
}
let FE=[['آش موزه','دستور مادربزرگی از شرق گیلان',520,'f'],['املت سنتی موزه','با پوره گوجه‌فرنگی مزه‌دار',410,'b'],['لقمه شامی گوشت','با نان تنوری دست‌ساز',730,'f'],['چای موزه','زعفران، هل، دارچین و…',325,'t'],['موهیتو موزه','تکه‌های آناناس و سیروپ نارگیل',530,'m'],['دوغ موزه','نوشیدنی سرد سنتی',250,'n']];

// ===== سبد سفارش · رویدادها / order cart events =====
function tapFx(el){if(!el||reduceMotion())return;el.classList.remove('tapfx');void el.offsetWidth;el.classList.add('tapfx');setTimeout(()=>el.classList.remove('tapfx'),520)}
function addFromEl(b){const p=+b.dataset.p;if(!p)return;
  addOrMerge(b.dataset.k||'',b.dataset.t||'',b.dataset.te||'',b.dataset.l||'',b.dataset.le||'',p)}
document.addEventListener('click',e=>{
  const qy=e.target.closest('[data-qty]');if(qy){const i=+qy.dataset.qty,x=ORD[i];if(!x)return;
    x.q--;if(x.q<=0)ORD.splice(i,1);saveOrd();renderOrd();tapFx(qy);return}
  const b=e.target.closest('.fbt[data-add]');if(b){if(!b.disabled)addFromEl(b);return}
  const pk=e.target.closest('.p.pick');if(pk){tapFx(pk.closest('.it')||pk);addFromEl(pk);return}
  const it=e.target.closest('.it.pick,.fc.pick');if(it&&!e.target.closest('.fbt')){
    if(e.target.closest('a[href]'))return;
    tapFx(it);addFromEl(it);return}
  // پرش نرم از لینک‌های بخش «ویژه‌های موزه» (به‌جای پرش ناگهانی و آبی‌شدن لینک)
  const anc=e.target.closest('a[href^="#"]');if(anc){const idd=anc.getAttribute('href').slice(1);if(!idd)return;
    const tg=document.getElementById(idd);if(tg){e.preventDefault();
      tg.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'});
      history.replaceState(null,'',anc.getAttribute('href'));
      if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}}}
  if(e.target.closest('#ordcp')){copyOrd();return}
  if(e.target.closest('#ordwa')){waOrd();return}
  if(e.target.closest('#ordclr')){if(!ORD.length)return;if(!confirm(UI[L].ordclr+'؟'))return;ORD=[];saveOrd();$('ordta').value='';try{localStorage.removeItem('ordAt')}catch(e){}renderOrd();return}
  if(e.target.closest('#ordcl')){ORD=[];saveOrd();$('ordta').value='';renderOrd();return}
  if(e.target.closest('#ordx')){$('ord').classList.remove('open','pop');return}
  if(e.target.closest('#ordsum')){const ta=$('ordta');ta.hidden=!ta.hidden;if(!ta.hidden)ta.focus();return}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;
  const qy=e.target.closest('[data-qty]');if(qy){e.preventDefault();qy.click();return}
  const el=e.target.closest('.it.pick[role="button"],.fc.pick,.p.pick');if(!el)return;e.preventDefault();addFromEl(el)});
$('ordta').addEventListener('input',()=>{try{localStorage.setItem('ordnote',$('ordta').value)}catch(e){}});
try{$('ordta').value=localStorage.getItem('ordnote')||''}catch(e){}

// ===== دو راه قیمت‌ها / two price sources =====
// راه ۱ (اینترنت عادی): لینک CSV گوگل‌شیت — اکسل را در Google Sheets آپلود و Publish to web > CSV کنید.
const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSO11P7ViuJEUiE6ysAJV8MRdE67ZF1cylqV4ByFjTwtyHTmrg5huOwmINHB820S9bBTLWPoRHi5-Oh/pub?gid=930174820&single=true&output=csv';
// راه ۲ (قطعی اینترنت / سرور داخلی): فایل prices.json کنار همین index.html بگذارید.
// روی سرور داخلی (مثلاً Raspberry Pi یا هر PC در کافه) فقط یک فایل استاتیک سرو کنید؛ لازم نیست چیزی «درست» شود:
//   python -m http.server 8080   →   http://IP-سرور:8080
// ساختار prices.json = آبجکتیو به نام آیتم (فارسی) → قیمت جدید (به هزار تومان). نمونه:
//   {"اسپرسو":[["",330],["",280]],"کاپوچینو":360,"سوپ سفید":"soldout"}
// اولویت: گوگل‌شیت > prices.json > قیمت‌های داخل صفحه. اگر خط JSON باشد، منو با آخرین قیمت معتبر کار می‌کند.
const LOCAL_PRICES='prices.json';
async function loadLocalPrices(){
  try{const r=await fetch(LOCAL_PRICES+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const j=await r.json();let n=0;
    if(typeof j._pick==='string')PICK=j._pick;
    M.forEach(s=>s.i.forEach(it=>{if(it[0]==='_pick')return;const v=j[it[0]];if(v===undefined)return;
      if(v==='soldout'){it[3]=1;n++;return}
      it[2]=v;it[3]=0;n++}));
    TODAY=dailyPick();render()
  }catch(e){/* آفلاین کامل: همان قیمت‌های کش‌شده/داخل صفحه */}
}
function parseCSV(t){const R=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c||r.length){r.push(c);R.push(r)}return R}
const latin=v=>String(v||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
function applyRows(rows){
  const h=rows.shift().map(x=>x.trim());
  const R=rows.filter(x=>x.length>2).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])));
  if(R.length<5)return false;
  M.forEach(s=>{const rs=R.filter(r=>r.section===s.id&&r.available.toLowerCase()!=='no');
    s.i=rs.map(r=>{const so=r.available.toLowerCase()==='soldout',p1=latin(r.price),p2=latin(r.price2);
      const la=r.label_fa.split('|').map(x=>x.trim()),le=r.label_en.split('|').map(x=>x.trim());
      la.forEach((x,k)=>{if(x&&le[k])LBL[x]=le[k]});
      let p='';
      if(!so&&p1){p=s.c.length?[['',+p1]].concat(p2?[['',+p2]]:[]):(p2?[[la[0]||'',+p1],[la[1]||'',+p2]]:+p1)}
      return[r.name_fa,r.desc_fa,p,so,r.tags||'']});
    EN[s.id].i=rs.map(r=>[r.name_en||r.name_fa,r.desc_en||''])});
  const fe=R.filter(r=>r.featured.toLowerCase()==='yes'&&r.available.toLowerCase()==='yes'&&latin(r.price));
  if(fe.length){FE=fe.map(r=>[r.name_fa,r.desc_fa,+latin(r.price),r.section]);FEN=fe.map(r=>[r.name_en||r.name_fa,r.desc_en||''])}
  TODAY=dailyPick();
  return true}
async function loadSheet(){if(!SHEET_CSV)return;
  try{const r=await fetch(SHEET_CSV+(SHEET_CSV.includes('?')?'&':'?')+'t='+Date.now());
    if(r.ok&&applyRows(parseCSV(await r.text())))render()}catch(e){}}
render();loadLocalPrices();loadSheet();
